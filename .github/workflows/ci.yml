name: ci

on:
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "schema/**"
      - "fixtures/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "schema/**"
      - "fixtures/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  workflow_dispatch:

# Path filters above apply only to push/pull_request; workflow_dispatch always
# runs regardless. See the PR description for the required-status-check
# implication of path-filtering these jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Backs the control-plane tests (`TestApp::with_control`): workspace
      # membership, app definitions, saved queries, schema catalog. Trust
      # auth, no password, matching local dev -- this is a throwaway
      # container, never a real database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_CONTROL_DATABASE_URL: postgres://postgres@localhost:5432/lula_test
    steps:
      - uses: actions/checkout@v4

      # No channel is pinned here: `rust-toolchain.toml` at the repo root is
      # the single source of truth for the exact version and components
      # (rustfmt, clippy), so this and a local `cargo clippy` can never drift
      # apart the way they did for step 1.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # SQLite is bundled and every test uses a temp file, so no network is
      # needed for the data-plane tests. The xAI extractor is tested against
      # a loopback fake, and JWT verification against a loopback JWKS
      # server: no key, no real network either way. The `postgres` service
      # above backs the control-plane tests (workspaces, app definitions,
      # saved queries, schema catalog); they skip themselves if
      # TEST_CONTROL_DATABASE_URL is ever unset.
      - name: Test
        run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
