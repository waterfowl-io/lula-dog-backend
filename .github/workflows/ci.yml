name: ci

on:
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  workflow_dispatch:

# Path filters above apply only to push/pull_request; workflow_dispatch always
# runs regardless. See the PR description for the required-status-check
# implication of path-filtering these jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No channel is pinned here: `rust-toolchain.toml` at the repo root is
      # the single source of truth for the exact version and components
      # (rustfmt, clippy), so this and a local `cargo clippy` can never drift
      # apart the way they did for step 1.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # SQLite is bundled and every test uses a temp file, so no services are
      # needed. The xAI extractor is tested against a loopback fake: no key.
      - name: Test
        run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
