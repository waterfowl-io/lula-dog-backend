# cargo-deny: advisories, licenses, bans, sources. Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Unmaintained crates deep in the tree are reported for workspace crates only.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only. Add one here deliberately, never to silence a
# failure without reading what it is.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# This crate is `publish = false` and UNLICENSED.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
